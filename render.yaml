services:
  - type: web
    name: tuyendung-api
    env: node
    region: singapore
    plan: free
    rootDir: .
    buildCommand: NODE_ENV=development pnpm install --frozen-lockfile && pnpm --filter database db:push && pnpm --filter database db:generate && pnpm --filter api build
    startCommand: node apps/api/dist/main
    healthCheckPath: /api/v1/auth/me
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: MEILISEARCH_HOST
        sync: false
      - key: MEILISEARCH_API_KEY
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
